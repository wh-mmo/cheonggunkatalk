<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>카카오톡</title>
<style>
  :root { box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html { height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
  * { box-sizing:border-box; }
  body { margin:0; height:100%; background:#cfd2d6; display:flex; justify-content:center; align-items:center;
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Helvetica Neue",Arial,sans-serif; color:#222; }
  .phone { width:100%; max-width:400px; height:100%; max-height:740px; display:flex; flex-direction:column; background:#f6f6f4; overflow:hidden; position:relative; box-shadow:0 4px 24px rgba(0,0,0,.35); }
  @media (max-width:480px) { .phone { max-height:none; box-shadow:none; } }

  .status { flex:none; height:20px; background:linear-gradient(#eceef0,#b9bdc2); display:flex; align-items:center; justify-content:space-between; padding:0 8px; font-size:12px; font-weight:bold; color:#222; }
  .nav { flex:none; height:44px; background:linear-gradient(#6f5f5b,#3d2f2c); display:flex; align-items:center; justify-content:space-between; padding:0 8px; color:#fff; border-bottom:1px solid #241917; }
  .nav h1 { margin:0; font-size:19px; font-weight:bold; text-shadow:0 -1px 0 rgba(0,0,0,.5); position:absolute; left:90px; right:90px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nbtn { min-width:52px; height:30px; padding:0 10px; border-radius:6px; border:1px solid #1c1210; background:linear-gradient(#5b4c49,#2e2220); color:#fff; font-size:13px; font-weight:bold; display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; z-index:1; }
  .nbtn.back { border:none; border-radius:0; padding:0 12px 0 20px; clip-path:polygon(13px 0,100% 0,100% 100%,13px 100%,0 50%); filter:none; }
  .nbtn svg { width:22px; height:22px; fill:#fff; display:block; }
  .nbtn.ph { visibility:hidden; }

  .views { flex:1; min-height:0; position:relative; }
  .view { position:absolute; inset:0; overflow-y:auto; display:none; }
  .view.on { display:block; }

  .av { flex:none; width:50px; height:50px; border-radius:3px; background:
      radial-gradient(circle at 50% 36%, #f4f6f8 0 20%, transparent 21%),
      radial-gradient(ellipse at 50% 104%, #f4f6f8 0 46%, transparent 47%), #b4bec8; }
  .av.grp { background:
      radial-gradient(circle at 30% 42%, #8fb2d8 0 14%, transparent 15%),
      radial-gradient(circle at 70% 42%, #8fb2d8 0 14%, transparent 15%),
      radial-gradient(circle at 50% 36%, #7aa3d2 0 17%, transparent 18%),
      radial-gradient(ellipse at 50% 104%, #7aa3d2 0 44%, transparent 45%), #e3ecf5; }

  /* friends */
  #v-friends { background:#f7f7f5; }
  .frow { height:74px; display:flex; align-items:center; gap:12px; padding:0 10px; border-bottom:1px solid #e2e2de; }
  .frow .nm { font-size:17px; font-weight:bold; min-width:70px; max-width:34%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sbub { margin-left:auto; position:relative; max-width:58%; background:linear-gradient(#fdf6c6,#f5e79a); border:1px solid #dcca7c; border-radius:16px; padding:11px 16px; font-size:15px; color:#5d4f27; text-align:center; word-break:keep-all; }
  .sbub::before { content:""; position:absolute; left:-9px; top:50%; margin-top:-7px; border-style:solid; border-width:7px 9px 7px 0; border-color:transparent #dcca7c transparent transparent; }
  .sbub::after { content:""; position:absolute; left:-7px; top:50%; margin-top:-6px; border-style:solid; border-width:6px 8px 6px 0; border-color:transparent #fbf0b4 transparent transparent; }

  /* chat list */
  #v-chats { background:#e5eef8; }
  .crow { display:flex; align-items:center; gap:10px; padding:10px 10px 10px; border-bottom:1px solid #cddae7; cursor:pointer; min-height:78px; }
  .crow:active { background:#d6e4f2; }
  .crow .av { width:44px; height:44px; }
  .cmain { flex:1; min-width:0; }
  .ctop { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .cname { font-size:18px; color:#111; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ctime { font-size:11px; color:#8fa2b4; white-space:nowrap; }
  .clast { font-size:14px; color:#5c7084; margin-top:3px; line-height:1.35; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .cbadge { flex:none; align-self:center; min-width:26px; height:22px; padding:0 8px; border-radius:11px; background:linear-gradient(#e8573f,#c8301b); color:#fff; font-size:12px; font-weight:bold; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 1px rgba(0,0,0,.3); }

  /* room */
  #v-room { background-color:#7ec3cd; background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.09) 0 12px, rgba(255,255,255,0) 12px 24px); }
  #msgs { padding:10px 8px 14px; display:flex; flex-direction:column; gap:10px; }
  .m { display:flex; align-items:flex-end; gap:5px; }
  .m.me { justify-content:flex-end; }
  .m .mav { flex:none; width:36px; height:36px; align-self:flex-start; }
  .m .mav.av { width:36px; height:36px; }
  .col { display:flex; flex-direction:column; align-items:flex-start; max-width:68%; }
  .mname { font-size:14px; color:#1f3a40; margin:0 0 2px 4px; }
  .bub { position:relative; padding:9px 13px; border-radius:15px; font-size:16px; line-height:1.35; word-break:break-word; box-shadow:0 1px 1px rgba(0,0,0,.18); }
  .m.you .bub { background:#fff; border:1px solid #d7dcdf; }
  .m.you .bub::before { content:""; position:absolute; left:-7px; top:11px; border-style:solid; border-width:6px 8px 6px 0; border-color:transparent #fff transparent transparent; }
  .m.me .bub { background:linear-gradient(#fbe951,#f3d935); border:1px solid #d9bd22; }
  .m.me .bub::after { content:""; position:absolute; right:-7px; top:11px; border-style:solid; border-width:6px 0 6px 8px; border-color:transparent transparent transparent #f3d935; }
  .tp { flex:none; background:rgba(70,90,95,.62); color:#fff; font-size:10px; padding:3px 8px; border-radius:9px; white-space:nowrap; margin-bottom:2px; }
  .bar { flex:none; display:none; align-items:center; gap:6px; padding:6px 6px; background:linear-gradient(#e9ebee,#c3c7cd); border-top:1px solid #9aa0a8; }
  .bar.on { display:flex; }
  .rbtn { flex:none; width:38px; height:38px; border-radius:50%; border:2px solid #222; background:linear-gradient(#fff,#d8d8d8); display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer; }
  .rbtn svg { width:22px; height:22px; display:block; }
  .bar input { flex:1; min-width:0; height:38px; border:1px solid #777; border-radius:19px; padding:0 14px; font-size:16px; background:#fff; outline:none; }
  .send { flex:none; height:38px; padding:0 16px; border-radius:8px; border:1px solid #8b9097; background:linear-gradient(#e6e8eb,#b8bcc2); color:#fff; font-size:14px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; text-align:center; line-height:1; }

  /* tab bar */
  .tabs { flex:none; height:54px; background:linear-gradient(#343434,#000); display:flex; padding:2px 4px; border-top:1px solid #555; }
  .tabs.off { display:none; }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:#ddd; font-size:11px; font-weight:bold; border-radius:6px; cursor:pointer; position:relative; }
  .tab svg { width:26px; height:26px; fill:#9a9a9a; }
  .tab.on { background:linear-gradient(#4a4a4a,#2a2a2a); color:#fff; }
  .tab.on svg { fill:#7db6ec; }
  .tbadge { position:absolute; top:1px; left:50%; margin-left:6px; min-width:20px; height:20px; padding:0 5px; border-radius:10px; background:linear-gradient(#ef5a42,#c3301c); border:1px solid #fff; color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; }
  .av.img { background-size:cover; background-position:center; }
  .tab:active { background:linear-gradient(#3a3a3a,#1e1e1e); }
  .sysd { align-self:center; background:rgba(60,80,95,.55); color:#fff; font-size:13px; padding:7px 16px; border-radius:16px; text-align:center; max-width:92%; margin:4px 0; }
  .un { flex:none; align-self:flex-end; color:#f6e400; font-size:11px; font-weight:bold; margin-bottom:2px; text-shadow:0 0 2px rgba(0,0,0,.45); }
  .rowend { display:flex; align-items:flex-end; gap:5px; }
  .sp { flex:none; width:36px; }
  .emo { width:96px; height:96px; display:block; }
  .empty { padding:40px 20px; text-align:center; color:#8a8f94; font-size:15px; }
</style>
</head>

var FIXME=0;
var cur='friends', roomIdx=0;
var ICON_BUBBLE='<svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.5 1.4 4.7 3.6 6.2L4.5 21l4.2-2.2c1 .3 2.1.4 3.3.4 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg>';
var ICON_BOLT='<svg viewBox="0 0 24 24"><path d="M13.500 2 5 13.500h5.500L9.500 22 19 10.500h-5.500z"/></svg>';
var $=function(id){return document.getElementById(id);};
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function nowT(){var d=new Date(),h=d.getHours(),m=('0'+d.getMinutes()).slice(-2);return (h<12?'오전 ':'오후 ')+((h%12)||12)+':'+m;}
function avh(img,cls){return '<div class="av img '+(cls||'')+'" style="background-image:url('+img+')"></div>';}
function lastMsg(r){for(var i=r.msgs.length-1;i>=0;i--){var m=r.msgs[i];if(m.t||m.emo)return m;}return {t:'',time:''};}

function renderFriends(){
  $('v-friends').innerHTML=FRIENDS.map(function(f){
    return '<div class="frow">'+avh(f.img)+'<div class="nm">'+esc(f.n)+'</div>'+(f.s?'<div class="sbub">'+esc(f.s)+'</div>':'')+'</div>';
  }).join('');
}
function renderChats(){
  var tot=0;
  $('v-chats').innerHTML=ROOMS.map(function(c,i){
    tot+=c.unread||0; var l=lastMsg(c);
    var av=c.img?avh(c.img):'<div class="av grp"></div>';
    return '<div class="crow" data-i="'+i+'">'+av+'<div class="cmain"><div class="ctop"><div class="cname">'+esc(c.n)+(c.grp?' <b style="font-size:14px">('+c.cnt+')</b>':'')+'</div><div class="ctime">'+esc(l.time)+'</div></div><div class="clast">'+esc(l.emo?'이모티콘':l.t)+'</div></div>'+(c.unread?'<div class="cbadge">'+c.unread+'</div>':'')+'</div>';
  }).join('');
  $('tb').textContent=tot; $('tb').style.display=tot?'flex':'none';
  $('v-chats').querySelectorAll('.crow').forEach(function(r){r.addEventListener('click',function(){openRoom(+r.dataset.i);});});
}
function renderRoom(){
  var r=ROOMS[roomIdx], prev=null, out='';
  r.msgs.forEach(function(m){
    if(m.d){out+='<div class="sysd">'+esc(m.d)+'</div>';prev=null;return;}
    if(m.s){out+='<div class="sysd">'+esc(m.s)+'</div>';prev=null;return;}
    var tp='<div class="tp">'+esc(m.time)+'</div>';
    var un=m.un?'<div class="un">'+m.un+'</div>':'';
    var body=m.emo?CAT:'<div class="bub">'+esc(m.t)+'</div>';
    if(m.me){
      out+='<div class="m me">'+un+tp+body+'</div>';prev=null;
    } else {
      var first=prev!==m.w; prev=m.w;
      out+='<div class="m you">'+(first?avh(m.img,'mav'):'<div class="sp"></div>')+'<div class="col">'+(first?'<div class="mname">'+esc(m.w)+'</div>':'')+'<div class="rowend">'+body+tp+un+'</div></div></div>';
    }
  });
  $('msgs').innerHTML=out;
  var v=$('v-room'); v.scrollTop=v.scrollHeight;
}
function setView(id){
  document.querySelectorAll('.view').forEach(function(v){v.classList.toggle('on',v.id===id);});
}
function showTab(t){
  cur=t; setView('v-'+t);
  document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x.dataset.t===t);});
  var titles={friends:'친구',chats:'채팅'};
  $('nt').textContent=titles[t];
  var nl=$('nl'), nr=$('nr');
  nl.className='nbtn'; nl.textContent='편집'; nl.onclick=null;
  nr.className='nbtn'; nr.innerHTML=(t==='chats'?ICON_BUBBLE:'&nbsp;');
  if(t!=='chats') nr.classList.add('ph');
  $('tabs').classList.remove('off'); $('bar').classList.remove('on');
}
function openRoom(i){
  roomIdx=i; var c=ROOMS[i]; c.unread=0;
  setView('v-room');
  $('nt').textContent=c.n+(c.grp?' ('+c.cnt+'명)':'');
  var nl=$('nl'); nl.className='nbtn back'; nl.textContent='채팅('+ROOMS.length+')';
  nl.onclick=function(){renderChats();showTab('chats');};
  var nr=$('nr'); nr.className='nbtn'; nr.innerHTML=ICON_BOLT;
  $('tabs').classList.add('off'); $('bar').classList.add('on');
  renderRoom();
}
function sendMsg(){
  var inp=$('inp'), t=inp.value.trim(); if(!t) return;
  ROOMS[roomIdx].msgs.push({me:1,t:t,time:nowT()}); inp.value=''; renderRoom();
}
/* 친구/채팅 탭만 화면 전환. 친구추천·설정 탭은 눌려도 이동하지 않음 */
document.querySelectorAll('.tab').forEach(function(x){x.addEventListener('click',function(){if(x.dataset.t==='friends'||x.dataset.t==='chats')showTab(x.dataset.t);});});
$('send').addEventListener('click',sendMsg);
$('inp').addEventListener('keydown',function(e){if(e.key==='Enter')sendMsg();});
renderFriends(); renderChats(); showTab('friends');
</script>
</body>
</html>
